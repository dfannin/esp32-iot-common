# Check the library on every push: host unit tests, the web pages in a browser,
# and a compile of every example.
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  host-tests:
    name: Host unit tests (stats_util, retry schedule, IotMqtt, IotTime, IotOta, iot_status, iot_version, iot_web, fw_version.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make -C tests/host
      - name: Test tools/fw_version.sh
        run: sh tests/test_fw_version.sh

  web:
    name: Web pages (embedded files up to date, browser tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Embedded pages match web/ (tools/web_embed.py --check)
        run: |
          python3 tools/web_embed.py --check src/iot_web_assets.h IOT_WEB web/page.html web/style.css web/app.js
          cd examples/web_basic && python3 ../../tools/web_embed.py --check web_device.h DEVICE web/device.js
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Browser tests (tests/web/run.js)
        run: node tests/web/run.js

  compile:
    name: Compile the examples (Arduino core 3.x)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install the ESP32 core and PubSubClient
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          # The same core as the device repos (core 4.0.0 makes esp32-shed too big)
          arduino-cli core install esp32:esp32@3.3.13
          arduino-cli lib install PubSubClient
      - name: Compile the examples with this library (Minimal SPIFFS, as every device)
        run: |
          for ex in examples/*/; do
            echo "== $ex"
            arduino-cli compile --fqbn esp32:esp32:esp32:PartitionScheme=min_spiffs --warnings default --library . "$ex"
          done
